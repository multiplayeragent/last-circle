<style>

           align-items: center; gap: 8px; width: min(420px, calc(100vw - 32px)); text-align: center; text-shadow: 0 1px 3px #000b; font-weight: 800; }
  #watch p { width: 100%; margin: 0; }
  #watch button, .card button { min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; font: 800 15px system-ui, sans-serif; cursor: pointer; }
  button.go { background: #ffd166; color: #2a1f05; } button.go:disabled { background: #6b6f78; color: #d9dce2; cursor: default; }
  button.soft { background: #ffffff26; color: #fff; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0b111a66; }

  .card h2 { margin: 0 0 4px; font-size: 25px; line-height: 1.15; } #overSub { opacity: .85; font-size: 14px; }
  .card h3 { margin: 14px 0 4px; font-size: 12px; color: #ffd166; text-transform: uppercase; letter-spacing: .06em; text-align: left; }

  .card li.note { list-style: none; margin-left: -26px; } /* a status line, not a numbered entry */
  .card ul { margin: 0; padding: 0; list-style: none; font-size: 14px; text-align: left; } .card ul em { display: inline-block; width: 38px; font-style: normal; opacity: .6; }
  .card li span { float: right; font-variant-numeric: tabular-nums; opacity: .85; } .card li.me { color: #ffd166; font-weight: 700; }
  .card .row { display: flex; gap: 8px; margin-top: 16px; } .card .row button { flex: 1; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .7; }

  #safe { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); width: 0; height: 0; pointer-events: none; }
  @media (max-width: 640px) { #left { font-size: 18px; } #left small { font-size: 12px; } #feed { top: calc(max(10px, env(safe-area-inset-top)) + 106px); } #bars { width: min(240px, 60vw); } }

<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>

<body>
<canvas id="game"></canvas>
<div id="safe"></div>

  <div class="row"><button class="go" id="again">Play again</button><button class="soft" id="watchBtn">Watch</button></div><p id="next"></p>
</div></div>
<script>
/* ═══ LAST CIRCLE · a Multiplayer Agent starter ═══════════════════════════════════════
 * Top-down battle royale. Land, loot, stay inside the shrinking circle: last one standing wins.
 * Versus, 2–24 players; bots fill the match to about 16 fighters.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ island size, circle phases, health, armor, medkits, ammo, bots
 *   WEAPONS & LOOT  the four weapons, the six kinds of loot, what turns up where
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MAP ........... the seeded island (houses, trees, rocks, crates, loot, landing spots) and collision
 *   ZONE .......... the safe circle, worked out from the timestamps in `match`
 *   FIGHTERS ...... what people and bots share: firing, reloading, healing, picking things up
 *   BULLETS ....... bullets every screen flies, and who decides a hit
 *   MATCH (HOST) .. the match, loot, crates, who is out and in what place, the bots. Only the host writes these.
 *   BOT BRAIN ..... how a bot loots, breaks crates, fights, heals, finds doors and runs from the circle
 *   ME ............ landing, moving, shooting, looting, getting hit, watching. Each player writes its own.
 *   OTHERS ........ everyone else, eased between snapshots
 *   DRAW .......... camera, island, houses and roofs, loot, fighters, bullets, the circle, minimap
 *   HUD & RESULTS . players left, circle timer, kill feed, health, weapons, results card, leaderboard
 *   INPUT ......... WASD + mouse + keys, twin thumb sticks and buttons on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: x, y, aim, hp, armor, weapon,
 *     guns, dead, who got you, the match you're in) about 12 times a second, `hb` (heartbeat)
 *     once a second, `n`/`c` (name, color) once. Health, armor, ammo and medkits are your own.
 *   - Shots are events: "shot" {x, y, a, w, s}. `s` seeds the spread, so every screen flies the
 *     same pellets. A HIT IS THE VICTIM'S OWN FACT (as in Twin-Stick Arena): only you check
 *     bullets against yourself and take the damage; at 0 you set dead in `p` and send "down"
 *     {v, by, w, x, y, g, m}. The host does this for bots. Elsewhere a bullet just stops in a spark.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked
 *     out every frame. Only the host writes the shared fields:
 *       `match` {id, v, phase, seed, t0, zone, drop, endsAt, winner}: the seed builds the same
 *               island on every screen, `zone` is the circle's schedule as timestamps and `drop`
 *               says where each person lands.
 *       `world` {m, v, t, c, hp, d, g, nid}: loot taken, crates broken, crate damage, dropped
 *               loot, and the latest pickups (who got what).
 *       `tally` {m, v, e}: who is out, in what place, and who got them (kills are counted from it).
 *       `bots`  every bot, 10 times a second.
 *     A new host adopts all four and carries on: same island, same circle, same bots.
 *   - Loot: walking over an item sends "take" {id}. The host gives it to the first claim and adds
 *     [item, player, kind] to world.g; that player puts it in its own pockets.
 *   - Bot shots go out batched, 10 times a second: "shots" {list: [[bot, x, y, a, w, s], ...]}.
 *   - "again": Play again. The next match starts at once if no person is still in this one.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "kills": each player's most kills in one match, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  map: 3000,            // the island is map × map px
  seats: 16,            // bots fill the match up to this many fighters (20 bots at most: they share one field)
  hp: 100,              // health
  radius: 20,           // fighter size, px
  speed: 255,           // px/s
  healSlow: 0.45,       // share of your speed while you use a medkit
  armorSoak: 0.5,       // share of every hit your armor takes instead of you
  vestArmor: 50,        // armor one vest gives (100 at most)
  medHeal: 50,          // health a medkit gives back ...
  medMs: 1800,          // ... after this many ms
  maxMeds: 3,           // medkits you can carry
  ammoBox: 30,          // rounds in an ammo box
  gunAmmo: 20,          // spare rounds that come with a gun (it also comes loaded)
  maxAmmo: 180,         // spare rounds you can carry (every gun shares them)
  pickup: 36,           // px: walk this close to loot to pick it up
  lateJoinMs: 30000,    // people who arrive this soon after a match starts still land
  resultsMs: 10000,     // ms the final results show before the next match
  watchMs: 25000,       // once no person is still in, the next match starts after this long anyway
  // the safe circle, phase by phase: [wait s, shrink s, radius as a share of the map, damage per second outside]
  zone: [[30, 20, 0.36, 2], [18, 15, 0.21, 4], [14, 12, 0.11, 7], [10, 10, 0.05, 12], [8, 12, 0, 20]],
  crateHp: 60,          // damage that breaks a crate open
  botAim: 0.2,          // radians a bot's aim wanders
  botReact: 0.65,       // seconds a bot waits before it shoots at someone new
  botFireSlow: 2.0,     // bots pull the trigger this much slower than people can
  botRange: 420,        // px: bots pick fights this close (a bolder bot a bit further)
  botHitRange: 1000,    // px: a bot that gets shot goes after whoever did it from this far
  botCrate: 2,          // how much a bot wants to break a crate open (a vest is 2.5, a first gun 8)
  botCalmMs: 20000,     // for this long after landing, bots loot and only fight back (or fight someone right next to them)
  board: "kills",       // leaderboard name
};

// ── WEAPONS & LOOT ──────────────────────────────────────────────────────────────────
// Per weapon: damage per bullet, seconds between shots, bullet speed (px/s), range (px), spread (radians),
// bullets per shot, magazine, reload seconds; len/wid = how the barrel is drawn.
const GUNS = {
  f: { name: "Fists", dmg: 24, every: 0.45, speed: 1000, range: 50, spread: 0, pellets: 1, mag: 0, reload: 0, len: 0, wid: 0, color: "#ffffff" },
  p: { name: "Pistol", dmg: 15, every: 0.24, speed: 1150, range: 640, spread: 0.04, pellets: 1, mag: 12, reload: 1.1, len: 24, wid: 8, color: "#ffd166" },
  s: { name: "Shotgun", dmg: 11, every: 0.85, speed: 1000, range: 330, spread: 0.24, pellets: 7, mag: 5, reload: 1.8, len: 38, wid: 11, color: "#ff8a5b" },
  r: { name: "Rifle", dmg: 13, every: 0.11, speed: 1500, range: 900, spread: 0.07, pellets: 1, mag: 30, reload: 2.0, len: 50, wid: 8, color: "#7bdcff" },
};
const SLOTS = ["f", "p", "s", "r"];       // keys 1–4
const RANK = { f: 0, p: 1, s: 2, r: 3 };  // a gun you pick up goes in your hands if it ranks higher
// Loot kinds: the three guns, a = ammo box, v = armor vest, m = medkit.
const LOOT = { p: { name: "Pistol", color: "#ffd166" }, s: { name: "Shotgun", color: "#ff8a5b" }, r: { name: "Rifle", color: "#7bdcff" },
  a: { name: "Ammo", color: "#f2c94c" }, v: { name: "Armor", color: "#5ab8ff" }, m: { name: "Medkit", color: "#ff6b6b" } };
// What turns up where: [kind, weight]. Every house has one gun plus two more things.
const HOUSE_GUN = [["p", 5], ["s", 3], ["r", 2]];
const HOUSE_LOOT = [["a", 4], ["v", 2], ["m", 3], ["p", 1], ["s", 1], ["r", 1]];
const CRATE_LOOT = [["r", 3], ["s", 2], ["v", 3], ["m", 1], ["a", 1]];
const FIELD_LOOT = [["a", 4], ["m", 3], ["v", 1], ["p", 2]];
const BOT_NAMES = ["Viper", "Nova", "Rex", "Kilo", "Jinx", "Bolt", "Echo", "Blaze", "Moss", "Pike", "Zara", "Duke", "Ivy", "Flint", "Sage", "Onyx", "Rook", "Wren", "Ash", "Juno"];
const COLORS = ["#ff5d73", "#4cc9f0", "#ffd166", "#c77dff", "#ff9f1c", "#ffffff", "#3a56ff", "#f15bb5", "#2ec4b6", "#2b2d42", "#b5179e", "#9ef01a",
  "#00f5d4", "#7209b7", "#ffafcc", "#e63946", "#a0c4ff", "#fee440", "#8d99ae", "#ff006e", "#fb5607", "#06d6a0", "#bc6c25", "#3a86ff"];
const ROOFS = ["#b4533e", "#3f6f8f", "#6d5a8a", "#8a6a3e", "#4f7f5a", "#9b3f5c"];
const KEEP = { f: 0, p: 260, s: 120, r: 360 }; // distance a bot likes to fight at, by weapon

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'last-circle',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { map: 1500, seats: 10, resultsMs: 1500, watchMs: 9000, botReact: 0.15, botRange: 820, botFireSlow: 1.1, botCalmMs: 0,
  zone: [[1, 9, 0.34, 6], [2, 7, 0.19, 10], [2, 6, 0.08, 16], [2, 6, 0, 26]] });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const $ = (id) => document.getElementById(id);
const safeColor = (c) => (/^#[0-9a-fA-F]{3,8}$/.test(c) ? c : "#cccccc"); // colors from other screens end up in HTML
/** A fighter's color for text on the dark kill feed: the dark ones are mixed with white so the name can be read. */
function inkColor(c) {
  if (!/^#[0-9a-fA-F]{6}$/.test(c)) return "#ffffff";
  const n = parseInt(c.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 105 ? c : `rgb(${[r, g, b].map((v) => Math.round(v + (255 - v) * 0.55)).join(",")})`;
}

// ── MAP ─────────────────────────────────────────────────────────────────────────────
// Built from match.seed with a seeded random (mulberry32), so every screen builds the same island.
// Walls and crates are rects {x, y, w, h}; rocks and tree trunks are circles {x, y, r}.
const R = CONFIG.radius;
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
let MAP = null;          // the island of the current match
let crateBroken = "";    // world.c: "x" where a crate is broken open
function mapFor(seed) { if (!MAP || MAP.seed !== seed) MAP = makeMap(seed, CONFIG.map); return MAP; }

function makeMap(seed, M) {
  const rnd = mulberry32(seed), int = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const pickW = (table) => { let n = rnd() * table.reduce((s, [, w]) => s + w, 0); for (const [k, w] of table) if ((n -= w) < 0) return k; return table[0][0]; };
  const map = { seed, size: M, houses: [], walls: [], crates: [], trees: [], rocks: [], loot: [], spots: [], blotches: [], grid: new Map() };
  const T = 16, DOOR = 84; // wall thickness, door width
  const nearHouse = (x, y, pad) => map.houses.some((h) => x > h.x - pad && x < h.x + h.w + pad && y > h.y - pad && y < h.y + h.h + pad);
  const nearThing = (x, y, pad) => map.trees.some((o) => Math.hypot(o.x - x, o.y - y) < o.t + pad) || map.rocks.some((o) => Math.hypot(o.x - x, o.y - y) < o.r + pad) ||
    map.crates.some((c) => Math.hypot(c.x + c.w / 2 - x, c.y + c.h / 2 - y) < 36 + pad);
  const nearSpot = (x, y, pad) => map.spots.some((s) => Math.hypot(s.x - x, s.y - y) < pad);
  const addLoot = (k, x, y, crate = -1) => map.loot.push({ id: map.loot.length, k, x: Math.round(x), y: Math.round(y), crate });
  // houses: four walls, a door in two of them, one gun and two more things inside
  for (let tries = 0; map.houses.length < Math.round(M * M / 470000) && tries < 500; tries++) {
    const w = int(24, 32) * 10, h = int(18, 23) * 10, x = int(140, M - 140 - w), y = int(140, M - 140 - h);
    if (map.houses.some((o) => x < o.x + o.w + 180 && x + w + 180 > o.x && y < o.y + o.h + 180 && y + h + 180 > o.y)) continue;
    const house = { x, y, w, h, roof: ROOFS[int(0, ROOFS.length - 1)], doors: [], roofA: 1 };
    const doorSides = rnd() < 0.5 ? ["top", "bottom"] : ["left", "right"];
    for (const side of ["top", "bottom", "left", "right"]) {
      const flat = side === "top" || side === "bottom", len = flat ? w : h;
      const wx = side === "right" ? x + w - T : x, wy = side === "bottom" ? y + h - T : y;

  net.on("shots", (msg) => { if (msg && Array.isArray(msg.list)) for (const [id, x, y, a, w, s] of msg.list.slice(0, 40)) if (GUNS[w]) addShot(id, x, y, a, w, s); });
  net.on("down", (msg) => onDown(msg));
  net.on("take", (msg, from) => { if (host.acting && msg && typeof msg.id === "number") applyTake(from, msg.id); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...sharedBots().map((b) => b.color)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
